[project]
name = "ml-task1-p1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black==25.9.0",
    "fastapi>=0.156.5",
    "imblearn>=0.0",
    "ipykernel==6.30.1",
    "joblib==1.5.2",
    "jupyter==1.1.1",
    "matplotlib==3.10.7",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "pre-commit==4.3.0",
    "python-dotenv>=1.2.4",
    "ruff==0.14.0",
    "scikit-learn==1.7.2",
    "seaborn==0.13.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
ml-task1-p1 = "ml_task1_p1.main:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black[jupyter]>=25.9.0",
    "ipykernel>=6.30.1",
]

[tool.uv.build-backend]
module-name = "production_app"
