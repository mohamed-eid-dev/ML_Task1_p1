repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run ruff check .
        language: system
        pass_filenames: false
      - id: black
        name: Black
        entry: uv run black --check .
        language: system
        pass_filenames: false
      - id: tests
        name: Tests
        entry: uv run python -m unittest discover -s tests
        language: system
        pass_filenames: false
